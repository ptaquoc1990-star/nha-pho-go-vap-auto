name: Unzip deploy bundle
on:
  push:
    branches: [main]
    paths:
      - 'nha-pho-go-vap-auto-v2-deploy.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit extracted files
        run: |
          if [ ! -f nha-pho-go-vap-auto-v2-deploy.zip ]; then echo 'no zip file'; exit 0; fi
          unzip -o nha-pho-go-vap-auto-v2-deploy.zip -d extracted
          shopt -s dotglob
          cp -a extracted/. .
          rm -rf extracted nha-pho-go-vap-auto-v2-deploy.zip .github
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract deploy bundle' || exit 0
          git push
